---
services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - workspace-cache:/home/vscode
    working_dir: /workspace
    command: sleep infinity
    environment:
      MCP_TRANSPORT: "${MCP_TRANSPORT:-stdio}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      PORT: "${PORT:-3000}"
      DEBUG: "${DEBUG:-0}"
      QDRANT_URL: "http://qdrant:6333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "3000:3000"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # crawl4ai:
  #   image: unclecode/crawl4ai:latest
  #   container_name: crawl4ai
  #   ports:
  #     - "11235:11235"

  #   environment:
  #     # Optional: Override specific settings
  #     - CRAWL4AI_WORKERS=4
  #     - CRAWL4AI_MAX_CONCURRENT_TASKS=10
  #   volumes:
  #     # Optional: Persist cache and data
  #     - crawl4ai-cache:/app/.crawl4ai
  #     # Optional: Custom configuration
  #     - ./config/crawl4ai/config.yml:/app/config.yml:ro
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   # Resource limits (adjust based on your needs)
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #       reservations:
  #         memory: 2G
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data2:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_PORT=8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  workspace-cache:
  qdrant-storage:
  crawl4ai-cache:
  valkey-data2:
  searxng-cache:
