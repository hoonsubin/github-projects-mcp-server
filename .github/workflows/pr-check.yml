name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check src/server.ts
      - name: Run tests
        run: deno task test
      - name: Compile check
        run: deno task compile:all
