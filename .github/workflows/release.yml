name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write # required to create tags, releases, and upload assets

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the new tag can be pushed

      # Normalise: strip a leading "v" if the user included one, then re-add it
      # so the tag is always "vX.Y.Z" and the bare version is always "X.Y.Z".
      - name: Derive version
        id: version
        run: |
          RAW="${{ github.event.inputs.version }}"
          BARE="${RAW#v}"
          echo "value=${BARE}"       >> "$GITHUB_OUTPUT"
          echo "tag=v${BARE}"        >> "$GITHUB_OUTPUT"

      # Create an annotated tag on the current branch ref and push it.
      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Patch the version string directly into source before compiling.
      # The binary reads Deno.env.get("RELEASE_VERSION") at runtime, but end users
      # won't set that env var - so we replace the literal in index.ts here so the
      # correct version is baked into every compiled binary.
      - name: Patch version into source
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s/Deno.env.get(\"RELEASE_VERSION\") ?? \"dev\"/\"${VERSION}\"/" src/index.ts

      # Cross-compile all four platform targets from this single Linux runner.
      # deno compile embeds the JS bundle into a platform-specific denort binary -
      # no native toolchain is needed for cross-compilation.
      - name: Compile all targets
        run: deno task compile:all

      # Generate sha256 checksums for every binary in dist/.
      # The checksums file is uploaded as an additional release asset.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # Create the GitHub Release and upload all dist/ files as assets.
      # --generate-notes pulls PR titles and commit messages since the last tag.
      - name: Publish release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            dist/mcp-server-mac-arm64 \
            dist/mcp-server-mac-x64 \
            dist/mcp-server-linux-x64 \
            dist/mcp-server-linux-arm64 \
            dist/mcp-server-win.exe \
            dist/checksums.txt
