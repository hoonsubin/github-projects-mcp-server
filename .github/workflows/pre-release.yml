name: Pre-release

# Fires on every push to main (i.e. every merged PR).
# Produces two releases for each merge:
#
#   1. Commit-pinned pre-release  — tag: v<latest-release>-pre.<sha7>
#      e.g. v1.2.3-pre.abc1234.  Permanent record; useful for bisecting
#      regressions across merges.  Base version tracks the latest full
#      release tag (vX.Y.Z); falls back to 0.0.0 if none exists yet.
#
#   2. Rolling "edge" release     — tag: edge  (force-updated each run)
#      Always points to the latest commit on main.  Consumers who always
#      want the freshest build pin to "edge" instead of a specific hash.

on:
  push:
    branches:
      - main

permissions:
  contents: write # required to create/delete releases, push tags

jobs:
  pre-release:
    name: Build & publish pre-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so git tag -f edge can be pushed cleanly.
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Find the latest full-release tag (vX.Y.Z, no pre-release suffix) and use
      # it as the base version.  Falls back to 0.0.0 if no release tag exists yet.
      #   base   →  1.2.3               (latest release tag, "v" stripped)
      #   value  →  1.2.3-pre.abc1234   (written into binaries)
      #   tag    →  v1.2.3-pre.abc1234  (GitHub release tag)
      - name: Derive version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -1)
          BASE="${BASE#v}"          # strip leading "v"
          BASE="${BASE:-0.0.0}"     # fallback if no release tag exists yet
          echo "short_sha=${SHORT_SHA}"                >> "$GITHUB_OUTPUT"
          echo "value=${BASE}-pre.${SHORT_SHA}"        >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-pre.${SHORT_SHA}"         >> "$GITHUB_OUTPUT"

      # Bake the version string directly into source before compiling so the
      # binary reports the correct version at runtime without needing env vars.
      - name: Patch version into source
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s/Deno.env.get(\"RELEASE_VERSION\") ?? \"dev\"/\"${VERSION}\"/" src/server.ts

      # Cross-compile all five platform targets from this single Linux runner.
      - name: Compile all targets
        run: deno task compile:all

      # SHA-256 checksums for every binary in dist/.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # ── Commit-pinned pre-release ──────────────────────────────────────────
      # gh release create also creates the git tag on the current commit if it
      # does not already exist, so no separate "git tag" step is needed here.
      # Skipped under act: act injects ACT=true and has no gh CLI; publish steps
      # interact with the real GitHub API and must only run on GitHub's runners.
      - name: Publish commit-pinned pre-release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "Pre-release $TAG" \
            --generate-notes \
            --prerelease \
            dist/mcp-server-mac-arm64 \
            dist/mcp-server-mac-x64 \
            dist/mcp-server-linux-x64 \
            dist/mcp-server-linux-arm64 \
            dist/mcp-server-win.exe \
            dist/checksums.txt

      # ── Rolling "edge" release ─────────────────────────────────────────────
      # Delete the previous edge release and tag before recreating so the
      # assets are always the binaries from the latest commit on main.
      - name: Delete previous edge release & tag (if any)
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes 2>/dev/null || true
          git push origin :refs/tags/edge          2>/dev/null || true

      - name: Publish rolling edge release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"

          # Force-create the edge tag on this commit and push it.
          git tag -f edge
          git push origin edge --force

          gh release create edge \
            --title "Edge (latest pre-release)" \
            --notes $'Rolling pre-release — always tracks the latest commit on `main`.\n\nCurrent build: [`'"$TAG"'`](../../releases/tag/'"$TAG"') · commit `'"$SHA"'`' \
            --prerelease \
            dist/mcp-server-mac-arm64 \
            dist/mcp-server-mac-x64 \
            dist/mcp-server-linux-x64 \
            dist/mcp-server-linux-arm64 \
            dist/mcp-server-win.exe \
            dist/checksums.txt

      # ── Prune old pre-releases ─────────────────────────────────────────────
      # Retention rules (applied in order, each pass only sees survivors of the
      # previous one so the rules compose correctly):
      #
      #   1. Per ISO calendar week  → keep the 12 most recent builds
      #   2. Per calendar month     → keep the  7 most recent builds
      #   3. Hard cap               → keep at most 50 total
      #
      # Under act: --mock generates 80 synthetic releases so the algorithm can
      # be verified without credentials or a real repo.  --dry-run ensures
      # nothing is deleted.  On GitHub runners both flags are omitted and the
      # script calls gh against the real repo.
      - name: Prune old pre-releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${ACT}" ]]; then
            python3 scripts/prune-pre-releases.py --mock --dry-run
          else
            python3 scripts/prune-pre-releases.py
          fi
