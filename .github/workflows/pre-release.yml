name: Pre-release

# Fires on every push to main (i.e. every merged PR).
# Produces two releases for each merge:
#
#   1. Commit-pinned pre-release  — tag: v0.0.0-pre.<sha7>
#      Permanent record; useful for bisecting regressions across merges.
#
#   2. Rolling "edge" release     — tag: edge  (force-updated each run)
#      Always points to the latest commit on main.  Consumers who always
#      want the freshest build pin to "edge" instead of a specific hash.

on:
  push:
    branches:
      - main

permissions:
  contents: write # required to create/delete releases, push tags

jobs:
  pre-release:
    name: Build & publish pre-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so git tag -f edge can be pushed cleanly.
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Derive both the human-readable version string and the release tag from
      # the first 7 characters of the triggering commit SHA.
      #   value  →  0.0.0-pre.abc1234   (written into binaries)
      #   tag    →  v0.0.0-pre.abc1234  (GitHub release tag)
      - name: Derive version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}"          >> "$GITHUB_OUTPUT"
          echo "value=0.0.0-pre.${SHORT_SHA}"    >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.0-pre.${SHORT_SHA}"     >> "$GITHUB_OUTPUT"

      # Bake the version string directly into source before compiling so the
      # binary reports the correct version at runtime without needing env vars.
      - name: Patch version into source
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s/Deno.env.get(\"RELEASE_VERSION\") ?? \"dev\"/\"${VERSION}\"/" src/index.ts

      # Cross-compile all five platform targets from this single Linux runner.
      - name: Compile all targets
        run: deno task compile:all

      # SHA-256 checksums for every binary in dist/.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # ── Commit-pinned pre-release ──────────────────────────────────────────
      # gh release create also creates the git tag on the current commit if it
      # does not already exist, so no separate "git tag" step is needed here.
      - name: Publish commit-pinned pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "Pre-release $TAG" \
            --generate-notes \
            --prerelease \
            dist/mcp-server-mac-arm64 \
            dist/mcp-server-mac-x64 \
            dist/mcp-server-linux-x64 \
            dist/mcp-server-linux-arm64 \
            dist/mcp-server-win.exe \
            dist/checksums.txt

      # ── Rolling "edge" release ─────────────────────────────────────────────
      # Delete the previous edge release and tag before recreating so the
      # assets are always the binaries from the latest commit on main.
      - name: Delete previous edge release & tag (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes 2>/dev/null || true
          git push origin :refs/tags/edge          2>/dev/null || true

      - name: Publish rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"

          # Force-create the edge tag on this commit and push it.
          git tag -f edge
          git push origin edge --force

          gh release create edge \
            --title "Edge (latest pre-release)" \
            --notes $'Rolling pre-release — always tracks the latest commit on `main`.\n\nCurrent build: [`'"$TAG"'`](../../releases/tag/'"$TAG"') · commit `'"$SHA"'`' \
            --prerelease \
            dist/mcp-server-mac-arm64 \
            dist/mcp-server-mac-x64 \
            dist/mcp-server-linux-x64 \
            dist/mcp-server-linux-arm64 \
            dist/mcp-server-win.exe \
            dist/checksums.txt

      # ── Prune old pre-releases ─────────────────────────────────────────────
      # Retention rules (applied in order, each pass only sees survivors of the
      # previous one so the rules compose correctly):
      #
      #   1. Per ISO calendar week  → keep the 12 most recent builds
      #   2. Per calendar month     → keep the  7 most recent builds
      #   3. Hard cap               → keep at most 50 total
      #
      # The "edge" release is excluded because its tag does not match the
      # v0.0.0-pre.* pattern.  --cleanup-tag removes both the release and its
      # git tag in a single call.  continue-on-error ensures a pruning hiccup
      # never fails the overall publish run.
      - name: Prune old pre-releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          from datetime import datetime, timezone
          from collections import defaultdict

          WEEK_KEEP  = 12
          MONTH_KEEP =  7
          TOTAL_CAP  = 50

          # ── fetch ──────────────────────────────────────────────────────────
          raw = subprocess.run(
              ["gh", "release", "list", "--limit", "200",
               "--json", "tagName,createdAt,isPrerelease"],
              capture_output=True, text=True, check=True,
          ).stdout
          all_releases = json.loads(raw)

          # Only commit-pinned pre-releases; excludes "edge" and semver tags.
          pre = [
              r for r in all_releases
              if r["isPrerelease"] and r["tagName"].startswith("v0.0.0-pre.")
          ]

          # Newest first — all bucket slices below preserve this order.
          pre.sort(key=lambda r: r["createdAt"], reverse=True)

          to_delete: set[str] = set()

          def prune_buckets(releases, key_fn, keep):
              """Mark tags beyond `keep` in each bucket for deletion."""
              buckets: dict[str, list[str]] = defaultdict(list)
              for r in releases:
                  dt = datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  buckets[key_fn(dt)].append(r["tagName"])
              for tags in buckets.values():
                  if len(tags) > keep:
                      to_delete.update(tags[keep:])  # oldest end of newest-first list

          # Pass 1 — weekly (ISO 8601 week: %G-W%V handles year-boundary correctly)
          prune_buckets(pre, lambda dt: dt.strftime("%G-W%V"), WEEK_KEEP)

          # Pass 2 — monthly (survivors from pass 1 only)
          survivors = [r for r in pre if r["tagName"] not in to_delete]
          prune_buckets(survivors, lambda dt: dt.strftime("%Y-%m"), MONTH_KEEP)

          # Pass 3 — hard cap (survivors from passes 1+2)
          survivors = [r for r in pre if r["tagName"] not in to_delete]
          if len(survivors) > TOTAL_CAP:
              to_delete.update(r["tagName"] for r in survivors[TOTAL_CAP:])

          # ── report ─────────────────────────────────────────────────────────
          print(f"Pre-releases found: {len(pre)} | marked for deletion: {len(to_delete)}", file=sys.stderr)

          if not to_delete:
              print("Nothing to prune.", file=sys.stderr)
              sys.exit(0)

          # ── delete ─────────────────────────────────────────────────────────
          errors = 0
          for tag in sorted(to_delete):
              print(f"  deleting {tag}", file=sys.stderr)
              result = subprocess.run(
                  ["gh", "release", "delete", tag, "--yes", "--cleanup-tag"],
              )
              if result.returncode != 0:
                  print(f"  WARNING: failed to delete {tag}", file=sys.stderr)
                  errors += 1

          print(f"Pruning complete — {len(to_delete) - errors} deleted, {errors} failed.", file=sys.stderr)
          sys.exit(1 if errors else 0)
          EOF
