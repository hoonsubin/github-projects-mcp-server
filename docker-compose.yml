services:
  github-projects-mcp:
    build: .
    container_name: github-projects-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3030
    ports:
      - "3030:3030" # host:container port mapping
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Resource limits - this is a lightweight process
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # Optional: add to your existing Open WebUI compose file instead
  # open-webui:
  #   ...
  #   environment:
  #     - MCP_SERVER_URL=http://github-projects-mcp:3000/mcp
